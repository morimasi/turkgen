<!DOCTYPE html>
<html lang="tr" class="theme-coffee">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurkGen - Yapay Zeka Destekli Türkçe Soru Üretici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "jspdf": "https://aistudiocdn.com/jspdf@^2.5.1",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1"
  }
}
</script>
<style>
  /* Inter Font */
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap;
    src: url("https://rsms.me/inter/font-files/Inter-Regular.woff2?v=3.19") format("woff2");
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap;
    src: url("https://rsms.me/inter/font-files/Inter-Medium.woff2?v=3.19") format("woff2");
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap;
    src: url("https://rsms.me/inter/font-files/Inter-SemiBold.woff2?v=3.19") format("woff2");
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap;
    src: url("https://rsms.me/inter/font-files/Inter-Bold.woff2?v=3.19") format("woff2");
  }
  
  :root {
      /* Varsayılan (Slate) Tema Renkleri */
      --color-background: 248 250 252; /* slate-50 */
      --color-surface: 255 255 255; /* white */
      --color-worksheet-surface: var(--color-surface);
      --color-primary-100: 226 232 240; --color-primary-600: 71 85 105; --color-primary-700: 51 65 85;
      --color-text-primary: 30 41 59; /* slate-800 */
      --color-text-secondary: 71 85 105; /* slate-600 */
      --color-text-on-primary: 255 255 255; /* white */
      --color-border: 226 232 240; /* slate-200 */
      --color-ring: 100 116 139; /* slate-500 */

      --color-success-50: 240 253 244; --color-success-400: 74 222 128; --color-success-900: 22 101 52;
      --color-danger-50: 254 242 242; --color-danger-400: 248 113 113; --color-danger-900: 127 29 29;
  }
  
  .theme-sky {
    --color-primary-100: 224 242 254; --color-primary-600: 2 132 199; --color-primary-700: 3 105 161; --color-ring: 59 130 246;
  }
  .theme-emerald {
    --color-primary-100: 236 253 245; --color-primary-600: 16 185 129; --color-primary-700: 5 150 105; --color-ring: 34 197 94;
  }
  .theme-rose {
    --color-primary-100: 255 241 242; --color-primary-600: 225 29 72; --color-primary-700: 190 18 60; --color-ring: 244 63 94;
  }
  .theme-indigo {
    --color-primary-100: 238 242 255; --color-primary-600: 79 70 229; --color-primary-700: 67 56 202; --color-ring: 99 102 241;
  }
  .theme-slate { /* Varsayılan ile aynı */ }
  .theme-coffee {
    --color-background: 249 246 242;      /* Arka plan: Latte köpüğü gibi çok açık bej */
    --color-surface: 255 255 255;         /* Yüzey: Kartlar ve modallar için temiz beyaz */
    --color-worksheet-surface: 242 238 235;/* Çalışma sayfası: Hafif dokulu kağıt hissi veren kırık beyaz */
    --color-primary-100: 232 225 219;     /* Vurgu arka planı: Ana rengin çok açık tonu */
    --color-primary-600: 161 126 110;     /* Ana renk: Kapuçino gibi sıcak ve yumuşak bir kahverengi */
    --color-primary-700: 138 103 87;      /* Ana rengin koyu tonu: Butonların üzerine gelindiğinde kullanılır */
    --color-text-primary: 79 68 62;       /* Ana metin rengi: Koyu kahve, yüksek okunurluk için */
    --color-text-secondary: 126 111 102;  /* İkincil metin rengi: Daha yumuşak, sessiz bir kahverengi */
    --color-text-on-primary: 255 255 255; /* Ana renk üzerindeki metin: Butonlar için beyaz */
    --color-border: 228 222 217;          /* Kenarlık rengi: Çok hafif, zarif bir bej */
    --color-ring: 161 126 110;            /* Odaklanma halkası: Ana renkle uyumlu */
    
    --color-logo-spark: 210 153 71;       /* Logo parıltısı: Canlı bir altın rengi, sıcak bir dokunuş için */
    
    --color-success-50: 240 253 244;
    --color-success-400: 74 222 128;
    --color-success-900: 22 101 52;
    --color-danger-50: 254 242 242;
    --color-danger-400: 248 113 113;
    --color-danger-900: 127 29 29;
  }

  /* Tailwind'in bu değişkenleri kullanmasını sağlayan yardımcı sınıflar */
  .bg-background { background-color: rgb(var(--color-background)); }
  .bg-surface { background-color: rgb(var(--color-surface)); }
  .bg-worksheet-surface { background-color: rgb(var(--color-worksheet-surface)); }
  .bg-primary-100 { background-color: rgb(var(--color-primary-100)); }
  .bg-primary-600 { background-color: rgb(var(--color-primary-600)); }
  .hover\:bg-primary-700:hover { background-color: rgb(var(--color-primary-700)); }
  .disabled\:bg-primary-300:disabled { background-color: rgba(var(--color-primary-600), 0.4); }
  
  .text-primary-600 { color: rgb(var(--color-primary-600)); }
  .text-primary-700 { color: rgb(var(--color-primary-700)); }
  .hover\:text-primary-600:hover { color: rgb(var(--color-primary-600)); }
  .text-text-primary { color: rgb(var(--color-text-primary)); }
  .text-text-secondary { color: rgb(var(--color-text-secondary)); }
  .text-on-primary { color: rgb(var(--color-text-on-primary)); }
  
  .border-border { border-color: rgb(var(--color-border)); }
  .focus\:ring-primary-500:focus { --tw-ring-color: rgb(var(--color-ring)); }
  .focus\:border-primary-500:focus { border-color: rgb(var(--color-ring)); }

  .bg-success-50 { background-color: rgb(var(--color-success-50)); }
  .border-success-400 { border-color: rgb(var(--color-success-400)); }
  .text-success-900 { color: rgb(var(--color-success-900)); }
  .bg-danger-50 { background-color: rgb(var(--color-danger-50)); }
  .border-danger-400 { border-color: rgb(var(--color-danger-400)); }
  .text-danger-900 { color: rgb(var(--color-danger-900)); }

  .ring-primary-500 { --tw-ring-color: rgb(var(--color-ring)); }
  .text-primary-active { color: rgb(var(--color-primary-600)); }
  .border-primary-500 { border-color: rgb(var(--color-ring)); }
  
  /* Logo Animasyonu */
  .logo-spark {
      animation: spark-effect 3s ease-in-out infinite;
      transform-origin: center;
  }
  .logo-book {
      animation: book-effect 3s ease-in-out infinite;
      transform-origin: center;
  }

  @keyframes spark-effect {
      0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 1; }
      20% { transform: scale(1.3) rotate(60deg); opacity: 1; }
      35% { transform: scale(0) rotate(120deg); opacity: 0; }
      36%, 80% { transform: scale(0) rotate(0deg); opacity: 0; }
      95% { transform: scale(0.9) rotate(-60deg); opacity: 1; }
  }

  @keyframes book-effect {
      0%, 30%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
      45% { transform: scale(1.1) rotate(-10deg); opacity: 1; }
      60% { transform: scale(0.95) rotate(5deg); opacity: 1; }
      75% { transform: scale(1) rotate(0deg); opacity: 1; }
      95% { transform: scale(0) rotate(0deg); opacity: 0; }
  }
  
  /* Diğer Stiller */
  body { font-family: 'Inter', sans-serif; }
  .font-inter { font-family: 'Inter', sans-serif; }
  .font-atkinson-hyperlegible { font-family: 'Atkinson Hyperlegible', sans-serif; }
  
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; }
    .no-print { display: none !important; }
    .answer-hidden .correct-answer-indicator {
        background-color: var(--color-surface) !important; 
        border-color: var(--color-border) !important;
        color: var(--color-text-primary) !important; 
        font-weight: 400 !important;
    }
    .details-hidden details { display: none; }
  }
  .details-hidden details { display: none; }
  
  /* YENİ BİLDİRİM TOAST ANİMASYONLARI */
  @keyframes slide-in-from-right {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .animate-slide-in-from-right { animation: slide-in-from-right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
  
  @keyframes fade-out-to-right {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
  }
  .animate-fade-out-to-right { animation: fade-out-to-right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
  
  @keyframes progress-bar {
    from { width: 100%; }
    to { width: 0%; }
  }
  .animate-progress-bar { animation: progress-bar 5s linear forwards; }

  /* Yükleme Spinner Animasyonu */
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .animate-spin-slow {
      animation: spin-slow 4s linear infinite;
  }
  
  @keyframes fade-in-subtle {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-subtle {
      animation: fade-in-subtle 0.6s ease-out forwards;
  }

  /* --- YENİ ANİMASYONLAR --- */
  @keyframes fade-in-slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-slide-up {
      animation: fade-in-slide-up 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes fade-in-blur {
      from { opacity: 0; filter: blur(5px); transform: translateY(10px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
  }
  .animate-fade-in-blur {
      animation: fade-in-blur 0.4s ease-out forwards;
      opacity: 0; /* Animasyon başlamadan önce görünmez yap */
  }

  @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
  }
  .animate-fade-in { animation: fade-in 0.2s ease-out forwards; }

  @keyframes scale-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
  }
  .animate-scale-in { animation: scale-in 0.2s ease-out forwards; }
  
  /* --- Akordiyon ve Detaylar Stilleri --- */
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  
  .rotate-90-on-open[open] > summary svg { transform: rotate(90deg); }
  
  /* Akıcı Akordiyon Animasyonu */
  details .content-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease-out;
      overflow: hidden;
  }
  details[open] .content-wrapper {
      grid-template-rows: 1fr;
  }
</style>
</head>
  <body class="bg-background">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
